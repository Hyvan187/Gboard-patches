name: Build Samsung Email 6.2.16.5 Morphe Patch

on:
  push:
    branches:
      - build-samsung-email-62165-mpp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout build assets
        uses: actions/checkout@v4

      - name: Fetch pinned bearinmind source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/bearinmindcat/morphe-patches.git upstream
          cd upstream
          git checkout --detach 1df254204b2ce5c1ac1c6ac73ee94c5ed5defb44
          sed -i '/gradlePluginPortal()/a\        mavenCentral()' settings.gradle.kts
          python3 ../build-assets/samsung-email-62165-port.py
          {
            echo "org.gradle.parallel=false"
            echo "org.gradle.workers.max=2"
            echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8"
            echo "kotlin.compiler.execution.strategy=in-process"
          } >> gradle.properties
          git diff --check
          git diff --stat
          grep -q '6.2.16.5' patches/src/main/kotlin/org/ungoogled/patches/samsungemail/SamsungEmailConstants.kt
          grep -q 'getConsistentDeviceId' patches/src/main/kotlin/org/ungoogled/patches/samsungemail/misc/EnableNonOneUiPatch.kt

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile patched bundle with Samsung Email extension
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN" || { echo "::error::Missing MORPHE_PACKAGES_TOKEN"; exit 1; }
          cd upstream
          chmod +x ./gradlew
          ./gradlew :patches:buildAndroid --no-daemon --max-workers=2 --stacktrace

      - name: Verify generated Morphe patch archive
        shell: bash
        run: |
          set -euo pipefail
          find upstream/patches/build/libs -maxdepth 1 -name '*.mpp' -ls
          test -n "$(find upstream/patches/build/libs -maxdepth 1 -type f -name '*.mpp' -print -quit)"
          for f in upstream/patches/build/libs/*.mpp; do
            unzip -t "$f" | tail -2
            unzip -Z -1 "$f" | head -30 || true
          done

      - name: Upload importable MPP
        uses: actions/upload-artifact@v4
        with:
          name: samsung-email-62165-bearinmind-port-mpp
          path: upstream/patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 14
